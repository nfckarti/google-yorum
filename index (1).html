<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yorumlara Yönlendiriliyor...</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #333;
    border-top-color: #4f8cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #aaa; font-size: 0.95rem; }
  a { color: #4f8cff; }
</style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p id="msg">Yorumlar sayfasına yönlendiriliyor...</p>
    <p style="font-size:0.8rem;">
      Otomatik açılmazsa <a id="fallbackLink" href="#">buraya dokunun</a>.
    </p>
  </div>

<script>
  // Hedef: işletmenin Google Maps yorum sayfası
  var MAPS_URL = "https://www.google.com/maps/place//data=!4m4!3m3!1s0x14cab1e03d80ca15:0x16d3f91d2e655866!9m1!1b1";

  // Chrome'un iOS URL şeması: https:// -> googlechromes://
  var CHROME_URL = MAPS_URL.replace(/^https:\/\//, "googlechromes://");

  document.getElementById("fallbackLink").href = MAPS_URL;

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  function fallbackToNormalUrl() {
    window.location.replace(MAPS_URL);
  }

  if (isIOS) {
    // Chrome'u açmayı dene; başarısız olursa (Chrome yüklü değilse)
    // sayfa görünür kalır ve kısa süre sonra normal linke düşer.
    var fallbackTimer = setTimeout(fallbackToNormalUrl, 600);

    // Sayfa arka plana gidiyorsa (Chrome açıldıysa) fallback'i iptal et.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        clearTimeout(fallbackTimer);
      }
    });

    window.location.href = CHROME_URL;
  } else {
    // Android ve diğer platformlarda doğrudan normal linke git.
    fallbackToNormalUrl();
  }
</script>
</body>
</html>
