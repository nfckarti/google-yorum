<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyorsunuz...</title>
    <script>
        // Sayfa yüklenmesini bile beklemeden <head> içinde anında çalışır
        const urlParams = new URLSearchParams(window.location.search);
        const dataId = urlParams.get('d');

        if (dataId) {
            const isAndroid = /android/i.test(navigator.userAgent);
            let target = "";

            if (isAndroid) {
                // ANDROID: Haritalar uygulamasını açar ve doğrudan Yorumlar sekmesini gösterir
                target = `intent://www.google.com/maps/place//data=!4m4!3m3!1s${dataId}!9m1!1b1#Intent;scheme=https;package=com.google.android.apps.maps;end`;
            } else {
                // APPLE (iOS): Safari ve Haritalar'da yorumlar sekmesini açar
                target = `https://www.google.com/maps/place//data=!4m4!3m3!1s${dataId}!9m1!1b1`;
            }

            // Sayfayı anında yönlendir (history tutmadan doğrudan fırlar)
            window.location.replace(target);
        } else {
            // Eğer parametresiz açıldıysa doğrudan yönetim paneline gönder
            window.location.replace("admin.html");
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f8f9fa;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h3>Google Haritalar Açılıyor...</h3>
    <p>Açılmazsa aşağıdaki butona dokunun:</p>
    <a id="fallback-btn" href="#">Yorumları Aç</a>

    <script>
        // Yedek buton linki tanımlama
        if (dataId) {
            const isAndroid = /android/i.test(navigator.userAgent);
            const target = isAndroid 
                ? `intent://www.google.com/maps/place//data=!4m4!3m3!1s${dataId}!9m1!1b1#Intent;scheme=https;package=com.google.android.apps.maps;end`
                : `https://www.google.com/maps/place//data=!4m4!3m3!1s${dataId}!9m1!1b1`;
            document.getElementById('fallback-btn').href = target;
        }
    </script>
</body>
</html>
