<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profili Açılıyor...</title>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('u');

        if (username) {
            const isAndroid = /android/i.test(navigator.userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isAndroid) {
                // ANDROID: Resmi Instagram Uygulamasını Açar
                const androidIntent = `intent://instagram.com/_u/${username}/#Intent;package=com.instagram.android;scheme=https;end`;
                window.location.replace(androidIntent);
            } else if (isIOS) {
                // APPLE (iOS): Resmi Instagram Uygulamasını Açar
                window.location.replace(`instagram://user?username=${username}`);
                
                // Eğer cihazda Instagram uygulaması yüklü değilse 1 saniye sonra Safari'de açar
                setTimeout(() => {
                    window.location.replace(`https://www.instagram.com/${username}/`);
                }, 1000);
            } else {
                // Bilgisayar / Diğer
                window.location.replace(`https://www.instagram.com/${username}/`);
            }
        } else {
            // Parametre yoksa panele gönder
            window.location.replace("admin.html");
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #fafafa;
            text-align: center;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #dbdbdb;
            border-top: 4px solid #dc2743;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h3>Instagram Uygulaması Açılıyor...</h3>
    <p>Açılmazsa aşağıdaki butona dokunun:</p>
    <a id="btn" href="#">Profili Görüntüle</a>

    <script>
        if (username) {
            const isAndroid = /android/i.test(navigator.userAgent);
            const target = isAndroid 
                ? `intent://instagram.com/_u/${username}/#Intent;package=com.instagram.android;scheme=https;end`
                : `https://www.instagram.com/${username}/`;
            document.getElementById('btn').href = target;
        }
    </script>
</body>
</html>
