<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Maps Yorumları</title>
<meta name="robots" content="noindex">
<style>html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:grid;place-items:center;text-align:center;background:#fff;color:#333}.box{padding:24px}.spinner{width:32px;height:32px;border:4px solid #ddd;border-top-color:#4285f4;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}a{color:#1a73e8;font-weight:600}</style>
</head>
<body>
<div class="box"><div class="spinner"></div><div>Google Maps yorumları açılıyor…</div><div id="fallback" style="display:none;margin-top:14px"><a id="link" href="#">Yorumları aç</a></div></div>
<script>
(function () {
  var reviewsUrl = "https://www.google.com/maps/place//data=!4m4!3m3!1s0x14cab1e03d80ca15:0x16d3f91d2e655866!9m1!1b1";
  var iosMapsUrl = "comgooglemapsurl://" + reviewsUrl;
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.getElementById("link").href = reviewsUrl;
  if (isIOS) {
    window.location.replace(iosMapsUrl);
    setTimeout(function () { document.getElementById("fallback").style.display = "block"; }, 1200);
  } else {
    window.location.replace(reviewsUrl);
    setTimeout(function () { document.getElementById("fallback").style.display = "block"; }, 1500);
  }
})();
</script>
</body>
</html>
