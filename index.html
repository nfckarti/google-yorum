<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyorsunuz...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fafafa;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataId = urlParams.get('d');     // Google Maps parametresi
        const username = urlParams.get('u');   // Instagram parametresi

        const isAndroid = /android/i.test(navigator.userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        if (dataId) {
            // GOOGLE MAPS YÖNLENDİRMESİ
            if (isAndroid) {
                window.location.replace(`intent://www.google.com/maps/place//data=!4m4!3m3!1s${dataId}!9m1!1b1#Intent;scheme=https;package=com.google.android.apps.maps;category=android.intent.category.BROWSABLE;end`);
            } else {
                window.location.replace(`https://www.google.com/maps/place//data=!4m4!3m3!1s${dataId}!9m1!1b1`);
            }
        } else if (username) {
            // INSTAGRAM YÖNLENDİRMESİ
            if (isAndroid) {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = `instagram://user?username=${username}`;
                document.body.appendChild(iframe);

                setTimeout(() => {
                    window.location.replace(`intent://instagram.com/_u/${username}/#Intent;package=com.instagram.android;scheme=https;category=android.intent.category.BROWSABLE;end`);
                }, 500);
            } else if (isIOS) {
                window.location.replace(`instagram://user?username=${username}`);
                setTimeout(() => {
                    window.location.replace(`https://www.instagram.com/${username}/`);
                }, 1000);
            } else {
                window.location.replace(`https://www.instagram.com/${username}/`);
            }
        } else {
            window.location.replace("admin.html");
        }
    </script>
</body>
</html>
