<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Yorum Yönlendirmesi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #4285F4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>Google Yorumlarına Yönlendiriliyorsunuz...</h2>
    <p>Sayfa otomatik açılmazsa aşağıdaki butona tıklayın:</p>
    <a id="redirect-btn" class="btn" href="#">Yorum Yap</a>

    <script>
        // Hedef linkler
        const dataPath = "0x14cab1e03d80ca15:0x16d3f91d2e655866!9m1!1b1";
        
        // Android için doğrudan Google Maps uygulamasını açan Intent URL'si
        const androidUrl = "intent://www.google.com/maps/place//data=!4m4!3m3!1s" + dataPath + "#Intent;scheme=https;package=com.google.android.apps.maps;end";
        
        // iOS ve Masaüstü için standart HTTPS linki (Yorum sekmesini direkt açar)
        const universalUrl = "https://www.google.com/maps/place//data=!4m4!3m3!1s" + dataPath;

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        const btn = document.getElementById("redirect-btn");

        if (isAndroid) {
            btn.href = androidUrl;
            window.location.href = androidUrl;
        } else {
            // iOS ve diğer cihazlar için
            btn.href = universalUrl;
            window.location.href = universalUrl;
        }
    </script>
</body>
</html>
