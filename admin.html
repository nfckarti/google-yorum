<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Kart Yöneticisi</title>
    <style>
        :root {
            --google: #1a73e8;
            --insta: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f9fa;
            color: #202124;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        .tabs {
            display: flex;
            background: #f1f3f4;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            color: #5f6368;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: white;
            color: #202124;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        textarea:focus, input[type="text"]:focus {
            border-color: #1a73e8;
        }
        .btn-submit {
            width: 100%;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
            cursor: pointer;
        }
        .btn-google { background: var(--google); }
        .btn-google:hover { background: #1557b0; }
        .btn-insta { background: var(--insta); }
        .btn-insta:hover { opacity: 0.9; }

        .result {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }
        .url-box {
            word-break: break-all;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            margin: 10px 0;
            border: 1px solid #dadce0;
        }
        .btn-copy {
            background: #34a853;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .qr-box { margin-top: 15px; }
        .qr-box img {
            border-radius: 10px;
            border: 1px solid #dadce0;
            background: white;
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top: 0;">NFC Kart Oluşturucu</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('google')">⭐ Google Yorum</button>
            <button class="tab-btn" onclick="switchTab('instagram')">📸 Instagram</button>
        </div>

        <!-- GOOGLE YORUM SEKMESİ -->
        <div id="tab-google" class="tab-content active">
            <p style="font-size: 13px; color: #5f6368; text-align: left; margin-bottom: 8px;">Google Haritalar Paylaşım Linki:</p>
            <textarea id="google-input" rows="3" placeholder="https://maps.app.goo.gl/..."></textarea>
            <button id="btn-google-submit" class="btn-submit btn-google" onclick="generateGoogleLink()">Google Yorum NFC Linki Üret</button>
        </div>

        <!-- INSTAGRAM SEKMESİ -->
        <div id="tab-instagram" class="tab-content">
            <p style="font-size: 13px; color: #5f6368; text-align: left; margin-bottom: 8px;">Instagram Kullanıcı Adı veya Profil Linki:</p>
            <input type="text" id="insta-input" placeholder="@kullanici_adi veya profil linki">
            <button class="btn-submit btn-insta" onclick="generateInstaLink()">Instagram NFC Linki Üret</button>
        </div>

        <!-- SONUÇ EKRANI -->
        <div id="result-box" class="result">
            <label id="result-title" style="font-weight: bold; font-size: 14px;"></label>
            <div id="output-url" class="url-box"></div>
            <button class="btn-copy" onclick="copyLink()">NFC Linkini Kopyala</button>

            <div class="qr-box">
                <img id="qr-img" src="" width="150" height="150" alt="QR Kod">
            </div>
        </div>
    </div>

    <script>
        const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', '');

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('result-box').style.display = 'none';

            if (tab === 'google') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-google').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-instagram').classList.add('active');
            }
        }

        async function generateGoogleLink() {
            const input = document.getElementById('google-input').value.trim();
            const btn = document.getElementById('btn-google-submit');
            if (!input) return alert("Lütfen Haritalar linkini yapıştırın!");

            btn.disabled = true;
            btn.innerText = "Yorum Kodu Çözümleniyor...";

            let hexData = null;
            const directMatch = input.match(/!1s(0x[0-9a-fA-F]+:0x[0-9a-fA-F]+)/) || input.match(/(0x[0-9a-fA-F]+:0x[0-9a-fA-F]+)/);
            
            if (directMatch) {
                hexData = directMatch[1] || directMatch[0];
            } else {
                const urlMatch = input.match(/(https?:\/\/[^\s]+)/);
                const target = urlMatch ? urlMatch[0] : input;
                hexData = await resolveShortLink(target);
            }

            btn.disabled = false;
            btn.innerText = "Google Yorum NFC Linki Üret";

            if (hexData) {
                const finalUrl = `${baseUrl}?d=${hexData}`;
                showResult("⭐ Google Yorum Kartı Linki:", finalUrl);
            } else {
                alert("Haritalar linki çözümlenemedi. Lütfen linki kontrol edin.");
            }
        }

        async function resolveShortLink(url) {
            try {
                const res = await fetch(`https://unshorten.me/json/${encodeURIComponent(url)}`);
                const data = await res.json();
                if (data && data.resolved_url) {
                    const m = data.resolved_url.match(/0x[0-9a-fA-F]{14,18}:0x[0-9a-fA-F]{14,18}/);
                    if (m) return m[0];
                }
            } catch(e){}
            try {
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
                const text = await res.text();
                const m = text.match(/0x[0-9a-fA-F]{14,18}:0x[0-9a-fA-F]{14,18}/);
                if (m) return m[0];
            } catch(e){}
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if (data && data.contents) {
                    const m = data.contents.match(/0x[0-9a-fA-F]{14,18}:0x[0-9a-fA-F]{14,18}/);
                    if (m) return m[0];
                }
            } catch(e){}
            return null;
        }

        function generateInstaLink() {
            let input = document.getElementById('insta-input').value.trim();
            if (!input) return alert("Lütfen kullanıcı adını girin!");

            input = input.replace(/^@/, '');
            const urlMatch = input.match(/(?:instagram\.com|instagr\.am)\/([a-zA-Z0-9_\.\-]+)/i);
            if (urlMatch) input = urlMatch[1];
            const cleanUser = input.split('?')[0].replace(/\/$/, '').trim();

            const finalUrl = `${baseUrl}?u=${cleanUser}`;
            showResult("📸 Instagram Profil Kartı Linki:", finalUrl);
        }

        function showResult(title, url) {
            document.getElementById('result-title').innerText = title;
            document.getElementById('output-url').innerText = url;
            document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            document.getElementById('result-box').style.display = 'block';
        }

        function copyLink() {
            const text = document.getElementById('output-url').innerText;
            navigator.clipboard.writeText(text).then(() => alert("NFC Linki panoya kopyalandı! Kartınıza yazabilirsiniz."));
        }
    </script>
</body>
</html>
